name: Spring Snake Game CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  # ─── JUnit + Testcontainers (PostgreSQL) + Selenium ───────────────────────
  java-tests:
    name: Java Tests (JUnit + Testcontainers + Selenium)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and run Java tests
        working-directory: Stateful-Spring-Framework-Game-Snake
        run: mvn --batch-mode clean verify

      - name: Upload Surefire report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-report
          path: Stateful-Spring-Framework-Game-Snake/target/surefire-reports/
          retention-days: 7

  # ─── Playwright (frontend) ─────────────────────────────────────────────────
  playwright-tests:
    name: Playwright Frontend Tests
    runs-on: ubuntu-latest
    needs: java-tests

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: snake_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Stateful-Spring-Framework-Game-Snake/frontend-tests/package-lock.json

      - name: Install dependencies
        working-directory: Stateful-Spring-Framework-Game-Snake/frontend-tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: Stateful-Spring-Framework-Game-Snake/frontend-tests
        run: npx playwright install --with-deps chromium

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Start Spring application
        working-directory: Stateful-Spring-Framework-Game-Snake
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/snake_db
          SPRING_DATASOURCE_USERNAME: test_user
          SPRING_DATASOURCE_PASSWORD: test_pass
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
        run: |
          sleep 5
          mvn --batch-mode spring-boot:run -DskipTests > spring-boot.log 2>&1 &

      - name: Wait for app to start
        run: |
          echo "Waiting for Spring Boot to respond with 200 OK..."
          for i in {1..24}; do
            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080 | grep "200"; then
              echo "Spring Boot is UP!"
              sleep 5
              break
            fi
            echo "Attempt $i/24: Still waiting..."
            sleep 5
            if [ $i -eq 24 ]; then
              echo "Error: App failed to start. Showing logs:"
              cat Stateful-Spring-Framework-Game-Snake/spring-boot.log
              exit 1
            fi
          done

      - name: Run Playwright tests
        working-directory: Stateful-Spring-Framework-Game-Snake/frontend-tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Stateful-Spring-Framework-Game-Snake/frontend-tests/playwright-report/
          retention-days: 7

      - name: Upload Spring Boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-log
          path: Stateful-Spring-Framework-