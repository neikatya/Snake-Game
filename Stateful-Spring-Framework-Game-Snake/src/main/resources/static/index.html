<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Snake Game</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a2e;
            color: #e94560;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            border: 4px solid #16213e;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.7);
            background-color: #0f3460;
        }
        .ui { margin-bottom: 20px; text-align: center; }
        .controls { margin-top: 20px; color: #95a5a6; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="ui">
    <h1>Змейка на Spring Boot</h1>
    <div id="status">Загрузка...</div>
    <div class="stats" style="margin-top: 10px; color: #95a5a6;">Размер поля: <span id="field-size">...</span></div>
</div>

<canvas id="gameCanvas"></canvas>

<div class="controls">Используйте стрелки на клавиатуре для управления</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    let gridSize = 20;
    let cellSize = 0;
    let gameActive = true;

    async function init() {
        try {
            // 1. Получаем размер поля
            const response = await fetch('/getSize');
            gridSize = await response.json();

            // === ДОБАВЬТЕ ЭТУ СТРОКУ НИЖЕ ===
            document.getElementById('field-size').innerText = gridSize;
            // ===============================

            const displaySize = 500;
            canvas.width = displaySize;
            canvas.height = displaySize;
            cellSize = displaySize / gridSize;

            statusEl.innerText = "Игра началась!";
            gameLoop();
        } catch (err) {
            statusEl.innerText = "Ошибка подключения к серверу";
        }
    }

    async function gameLoop() {
        if (!gameActive) return;

        try {
            // 1. Делаем шаг змейки
            await fetch('/moveSnake', { method: 'POST' });

            // 2. Запрашиваем актуальные координаты
            const [snakeResp, appleResp] = await Promise.all([
                fetch('/getSnakeCoordinates'),
                fetch('/getAppleCoordinates')
            ]);

            const snake = await snakeResp.json();
            const apples = await appleResp.json();

            // Если сервер вернул пустую змейку (игра окончена в БД)
            if (snake.length === 0) {
                gameOver();
                return;
            }

            draw(snake, apples);
            setTimeout(gameLoop, 150); // Скорость игры

        } catch (err) {
            console.error("Ошибка в цикле игры:", err);
        }
    }

    function draw(snake, apples) {
        // Очистка фона
        ctx.fillStyle = "#0f3460";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Отрисовка яблок (используем x и y из Coordinates)
        ctx.fillStyle = "#e94560";
        apples.forEach(apple => {
            ctx.beginPath();
            ctx.arc(
                (apple.x * cellSize) + cellSize/2,
                (apple.y * cellSize) + cellSize/2,
                cellSize/2.5, 0, Math.PI * 2
            );
            ctx.fill();
        });

        // Отрисовка змейки
        snake.forEach((seg, index) => {
            ctx.fillStyle = index === 0 ? "#00ff7f" : "#4ade80"; // Голова ярче
            ctx.fillRect(
                seg.x * cellSize + 1,
                seg.y * cellSize + 1,
                cellSize - 2,
                cellSize - 2
            );
        });
    }

    function gameOver() {
        gameActive = false;
        statusEl.innerText = "ИГРА ОКОНЧЕНА! Перезагрузите страницу для новой игры.";
        statusEl.style.color = "yellow";
    }

    // Обработка нажатий через SnakeService.turnTo
    window.addEventListener('keydown', async (e) => {
        const keyMap = {
            'ArrowUp': 'UP',
            'ArrowRight': 'RIGHT',
            'ArrowDown': 'DOWN',
            'ArrowLeft': 'LEFT'
        };

        const dir = keyMap[e.key];
        if (dir) {
            await fetch('/turnTo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dir) // Spring конвертирует строку в Direction Enum
            });
        }
    });

    init();
</script>
</body>
</html>
